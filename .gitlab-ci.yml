# Backend CI/CD: build image -> push Harbor -> run migrations -> deploy via Ansible.
# Setup guide and variable list: backend_v2/deploy/README.md

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - backend_v2/**/*
        - .gitlab-ci.yml

stages:
  - test
  - build
  - migrate
  - deploy

variables:
  IMAGE: $HARBOR_HOST/$HARBOR_PROJECT/home-tour-backend
  # Shown in "Run pipeline" form. Empty = auto version from the pipeline number (CI_PIPELINE_IID).
  IMAGE_VERSION:
    value: ""
    description: "Image version, numbers only (e.g. 12 or 1.2.0). Leave empty for auto (pipeline number)."

# Resolves IMAGE_TAG: manual IMAGE_VERSION if given, else CI_PIPELINE_IID (same value on job retries).
.version:
  before_script:
    - IMAGE_TAG="${IMAGE_VERSION:-$CI_PIPELINE_IID}"
    - |
      if ! echo "$IMAGE_TAG" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
        echo "IMAGE_VERSION must be numbers only (e.g. 12 or 1.2.0), got: $IMAGE_TAG"
        exit 1
      fi
    - echo "Image tag $IMAGE_TAG"

# Shared SSH setup for jobs that talk to the server.
# SSH_PRIVATE_KEY: GitLab variable (type Variable) with the private key text, raw or base64-encoded.
.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -z "$SSH_PRIVATE_KEY" ]; then echo "SSH_PRIVATE_KEY is missing"; exit 1; fi
      # Raw key, or base64 (single line, so the variable can be masked)
      case "$SSH_PRIVATE_KEY" in
        *"BEGIN "*) printf '%s\n' "$SSH_PRIVATE_KEY" ;;
        *) printf '%s' "$SSH_PRIVATE_KEY" | base64 -d ;;
      esac | tr -d '\r' > ~/.ssh/id_deploy
      chmod 600 ~/.ssh/id_deploy
      if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null; then echo "SSH_PRIVATE_KEY is not a valid private key"; exit 1; fi
    # Trust the server host key on each run (connection goes over Tailscale)
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
    - SSH_OPTS="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes"

# Placeholder, not executed yet. Remove the `rules` block to enable.
test:
  stage: test
  image: node:20-alpine
  script:
    - cd backend_v2
    - npm ci
    - npm run lint
    - npm test
  rules:
    - when: never

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - !reference [.version, before_script]
  script:
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_HOST" -u "$HARBOR_USERNAME" --password-stdin
    - docker build -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:dev-latest" backend_v2
    - docker push "$IMAGE:$IMAGE_TAG"
    - docker push "$IMAGE:dev-latest"

# Runs pending migrations from the new image on the server (only the server can reach the DB).
# If this fails, deploy is skipped and the current container keeps running.
migrate:
  stage: migrate
  image: alpine:3.20
  resource_group: dev-server
  before_script:
    - !reference [.version, before_script]
    - !reference [.ssh_setup, before_script]
  script:
    - >
      ssh $SSH_OPTS -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
      "cd $DEPLOY_DIR &&
      docker pull $IMAGE:$IMAGE_TAG &&
      docker run --rm --network host --env-file .env $IMAGE:$IMAGE_TAG npm run migration:run:prod"

deploy:
  stage: deploy
  image: alpine:3.20
  resource_group: dev-server
  environment:
    name: dev
  before_script:
    - !reference [.version, before_script]
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache ansible git
    - git clone --depth 1 --branch "$ANSIBLE_REPO_REF" https://github.com/ntnduc/ansible-docker-compose.git /ansible
    - |
      cat > /ansible/inventory.ini <<EOF
      [web_hosts]
      backend ansible_host=$DEPLOY_HOST ansible_port=$DEPLOY_PORT ansible_user=$DEPLOY_USER ansible_ssh_common_args='$SSH_OPTS'
      EOF
    - |
      cat > /ansible/deploy_vars.yml <<EOF
      all:
        vars:
          remote_user: $DEPLOY_USER
          working_time: "{{ ansible_date_time.iso8601_basic_short }}"
          service_stacks:
            - docker_repository: $HARBOR_HOST/$HARBOR_PROJECT
              image_name: home-tour-backend
              image_version: $IMAGE_TAG
              working_directory: $DEPLOY_DIR
              version_key: VERSION
              env_file: .env
      EOF
  script:
    - cd /ansible
    - ansible-playbook playbook.yml -i inventory.ini -i deploy_vars.yml
